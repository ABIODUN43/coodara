# Render Blueprint Specification for Coodara
# Docs: https://render.com/docs/blueprint-spec

services:
  # --------------------------------------------------------------------------
  # 1. Coodara FastAPI Backend API Web Service
  # --------------------------------------------------------------------------
  - type: web
    name: coodara-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r apps/backend/requirements.txt && alembic upgrade head
    startCommand: cd apps/backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: coodara-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GITHUB_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: coodara-frontend
          property: url
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # --------------------------------------------------------------------------
  # 2. Coodara Celery Worker Service (Background Analysis & Task Queue)
  # --------------------------------------------------------------------------
  - type: worker
    name: coodara-worker
    runtime: python
    rootDir: .
    buildCommand: pip install -r apps/backend/requirements.txt
    startCommand: cd apps/backend && python start_worker.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: coodara-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: coodara-backend
          envVarKey: JWT_SECRET_KEY
      - key: GITHUB_TOKEN_ENCRYPTION_KEY
        fromService:
          type: web
          name: coodara-backend
          envVarKey: GITHUB_TOKEN_ENCRYPTION_KEY
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # --------------------------------------------------------------------------
  # 3. Coodara Frontend SPA Static Site
  # --------------------------------------------------------------------------
  - type: web
    name: coodara-frontend
    runtime: static
    rootDir: apps/frontend
    buildCommand: pnpm install && pnpm build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: coodara-backend
          property: url

databases:
  # Managed PostgreSQL Database
  - name: coodara-db
    databaseName: coodara
    user: coodara
    plan: free
